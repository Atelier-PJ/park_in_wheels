name: Cloud install script verification
on:
  push:
    branches: [work/pleos-integration]
    paths: ['.github/workflows/cloud-bootstrap.yml', 'scripts/setup-cloud.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify fresh Android and Gradle bootstrap
        env:
          POW_TOOLS_DIR: ${{ runner.temp }}/pow-tools
          ANDROID_HOME: ${{ runner.temp }}/pow-android-sdk
          ANDROID_SDK_ROOT: ${{ runner.temp }}/pow-android-sdk
        run: bash scripts/setup-cloud.sh
      - name: Check reuse in a new shell
        run: |
          source .pow-env.sh
          java -version
          gradle --version
          bash scripts/test-core.sh
          test -f app/build/outputs/apk/demo/debug/app-demo-debug.apk
          test -f app/build/outputs/apk/pleos/debug/app-pleos-debug.apk
